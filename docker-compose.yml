# =====================================================================
#  TP Keycloak — attaches to the SHARED `middleware` network (base:
#  ../springboot/docker-compose.yml, which runs listings-api +
#  listings-postgres). This project adds:
#       - keycloak          -> host 8081 (OIDC / admin), host 9001 (health)
#       - keycloak-postgres -> host 5436 (Keycloak's store)
#
#  Port map (host):
#       listings-api         8080   (base — no change for this TP; Keycloak moves)
#       listings-postgres    5435   (base — no change)
#       keycloak             8081   (this file — moved to keep 8080 for the API)
#       keycloak (management) 9001  (this file — health endpoints, container 9000)
#       keycloak-postgres    5436   (this file)
#
#  Network + resource sharing:
#    * The `middleware` network is created by the base project. This file
#      ATTACHES to it. Pinning it with `name: middleware` means both projects
#      use the same global Docker network, so the API and Keycloak can
#      reach each other by container name (listings-api <-> keycloak).
#    * Services discover each other by their `container_name`
#      (see the base file), NOT by `localhost`.
#
#  BEFORE YOU RUN: read "Run" in ../keycloak/README.md. It tells you the
#  ONE small edit to make in ../springboot/docker-compose.yml (point the API
#  at Keycloak's JWKS over the network name; the API's host port stays 8080).
#  The exact snippet is in the box at the bottom of this file.
#
#  Run order (base owns the API, so it is always there first):
#      $ cd ../springboot && docker compose up -d   # base: API on 8080 + pg on 5435
#      $ cd ..../keycloak && docker compose up -d   # this: Keycloak on 8081 + pg on 5436
#  Health (API) : curl -fsS http://localhost:8080/actuator/health
#  Health (KC)  : curl -fsS http://localhost:9001/health/ready
#                 (management port; /health/ready on 8081 is a 404)
# =====================================================================

name: keycloak-tp

networks:
  middleware:
    name: middleware      # SAME global network the base project creates

volumes:
  kc-data:
  keycloak-pgdata:

services:

  # ------------------------------------------------------------------
  #  Keycloak 26.8 — identity provider
  #  start-dev: no master admin password, no TLS (academic use only).
  #  --import-realm: imports every *.json in /opt/keycloak/data/import
  #  at first boot (that is our `listings` realm).
  #  Host port 8081 chosen so the API can keep 8080 (both on the shared net,
  #  no collision). Internal port stays 8080 (Keycloak default).
  #  issuer        : http://localhost:8081/realms/listings
  #  admin console : http://localhost:8081/admin  (admin/admin)
  #  user console  : http://localhost:8081/realms/listings/account/  (alice/secret)
  #  The app (listings-api) reaches us over the network name `keycloak`
  #  on its INTERNAL port 8080 (not the host 8081).
  # ------------------------------------------------------------------
  keycloak:
    image: keycloak/keycloak:26.8
    container_name: keycloak          # stable name for cross-network DNS
    command: >
      start-dev
      --http-relative-path=/
      --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"   # host 8081 -> container 8080 (OIDC, admin console, account console)
      - "9001:9000"   # host 9001 -> container 9000 (management: /health, /health/ready)
    volumes:
      # Bind our ./realm dir (realm.json) read-only into the import folder.
      - ./realm:/opt/keycloak/data/import:ro
      - kc-data:/opt/keycloak/data
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks: [middleware]
    healthcheck:
      # /health/ready is served on the MANAGEMENT port 9000 (Keycloak 25+), not on 8080.
      # "healthy" therefore means: realm imported and server ready, not just "port open".
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q UP <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------
  #  PostgreSQL 16 — Keycloak persistence (realm, clients, users).
  #  Kept SEPARATE from the API's listings-postgres (host 5435). Host 5436.
  # ------------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5436:5432"
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [middleware]

# =====================================================================
#  REQUIRED EDIT in ../springboot/docker-compose.yml  (see README "Run")
#
#  In the `listings-api` service, add this to `environment:` — this is
#  now the ONLY required edit for the Keycloak TP (the host port stays
#  8080, so no `ports` change is needed).
#
#      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8081/realms/listings"
#      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/realms/listings/protocol/openid-connect/certs"
#
#  WHY the split (2 different hostnames):
#    * issuer = what a browser / client sees (Host: localhost). Keycloak
#      copied the Host header into the JWT, so iss = http://localhost:8081/...
#      and the API must verify with that same issuer.
#    * JWKS   = fetched FROM INSIDE the API container. `localhost` there
#      is the container itself, so the fetch must go through the network
#      name `keycloak` on its internal port 8080.
#
#  Put issuer in application.yml (greppable); put JWKS-SET-URI here (via
#  the compose env) because it must use the network name, not localhost.
# =====================================================================
