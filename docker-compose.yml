# =====================================================================
#  TP Keycloak — identity stack
#
#  This compose starts ONLY the identity provider and its persistence.
#  The Spring Boot application (TP1, ../springboot) is started separately,
#  on the host, with `mvn spring-boot:run` (same command as TP1).
#
#  Full instructions: see `../README.md` and `exercise.md`.
#
#  Start            : docker compose up -d
#  Health check     : curl -fsS http://localhost:8080/health/ready
#  Stop (keep data) : docker compose down
#  Reset (wipe)     : docker compose down -v     (wipes Postgres + Keycloak)
# =====================================================================

name: keycloak-listings-tp

networks:
  keycloak-net:
    driver: bridge

volumes:
  kc-data:   # data Keycloak (sessions, cache, ...)
  pg-data:   # data Postgres (realm, clients, users)

services:

  # --------------------------------------------------------------------
  #  Postgres 16 — persistance de Keycloak (realm, clients, users)
  #
  #  NB: the TP1 Spring Boot application keeps using SQLite
  #  (see ../springboot/application.yml). This Postgres is Keycloak-only.
  # --------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: tp-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      # Host 5433 -> container 5432: keeps 5432 free in case the student
      # is running their own Postgres (pgadmin, local psql, etc.)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [keycloak-net]

  # --------------------------------------------------------------------
  #  Keycloak 26.8
  #
  #  - start-dev : no master password, no TLS (academic use only).
  #  - --import-realm : at first boot, Keycloak imports every `*.json`
  #    found in /opt/keycloak/data/import/  -> that is our `listings`
  #    realm. Strategy IGNORE_EXISTING: if the realm already exists on
  #    restart, it is kept.
  #
  #  - admin console : http://localhost:8080/admin  (admin/admin)
  #  - health        : http://localhost:8080/health/ready
  #  - issuer        : http://localhost:8080/realms/listings
  #
  #  If you modify realm.json, either:
  #    (a) reset with `docker compose down -v && docker compose up -d`
  #        (Keycloak data is lost), or
  #    (b) edit through the admin console at http://localhost:8080/admin
  # --------------------------------------------------------------------
  keycloak:
    image: keycloak/keycloak:26.8
    container_name: tp-keycloak
    command: >
      start-dev
      --http-relative-path=/
      --import-realm
    environment:
      # bootstrap admin (utilisable via l'admin REST API / l'admin console)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # datasource (postgres)
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # health endpoint
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"   # HTTP : OIDC, admin console, health
    volumes:
      # Mount the `./realm` directory (which contains realm.json)
      # read-only into Keycloak's import folder. A directory bind-mount
      # (not a single file) is reliable across all overlay drivers.
      - ./realm:/opt/keycloak/data/import:ro
      - kc-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [keycloak-net]
    healthcheck:
      # The Keycloak image does not ship `curl`. We do a plain TCP probe
      # on port 8080: if it is open the app is ready to serve (Keycloak
      # closes the port until bootstrap completes).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && exit 0' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
